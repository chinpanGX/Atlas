syntax = "proto3";

package atlas.internal.v1;

option csharp_namespace = "Atlas.Internal.V1";

// バトルサーバーから APIサーバーへの内部 API。Unity クライアントからは呼ばない(クライアント向けとは別のポートで出す)。
// メタデータ x-internal-secret に共有シークレット(環境変数 INTERNAL_API_SECRET)を付ける。無い・違うときは UNAUTHENTICATED。
// クライアント向けの API と違い、gRPC 基盤の認証・冪等性・メンテナンスの判定は通らない(メンテナンス中でも結果の報告を受ける)。
service BattleInternalService {
  // プレイヤーの今のパーティ(選出の候補)を、枠の番号の順に返す。未編成の枠は含まないので0〜6件。
  // 選出の画面で見せるのはどのパチモンかだけなので、努力値・技は返さない。
  rpc GetParty(GetPartyRequest) returns (GetPartyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 選出した個体の対戦用の所持データ(どのパチモンか・努力値・覚えている技)を、リクエストの順に返す。
  // 種族値・技の性能はバトルサーバーが自分のマスタから引く。
  // プレイヤーの所持個体でないもの(他人の個体・存在しない ID)が1体でもあれば NOT_FOUND を返す。
  rpc GetLoadouts(GetLoadoutsRequest) returns (GetLoadoutsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 対戦の結果を記録する。終了状態への更新・ターンの記録・勝者へのジェムの付与を1つのトランザクションで行う。
  // 対戦が無ければ NOT_FOUND、参加者でない ID が含まれていれば INVALID_ARGUMENT、
  // 記録済みなら ALREADY_EXISTS を返し、何も変えない(再送で二重に付与しない)。
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse);
}

message GetPartyRequest {
  // プレイヤーの ID(ULID)。
  string player_id = 1;
}

message GetPartyResponse {
  // パーティの個体。枠の番号の順。
  repeated PartyPachimon pachimon = 1;
}

// パーティに入っている個体1体。
message PartyPachimon {
  // 所持個体の ID(ULID)。
  string player_pachimon_id = 1;
  // pachimon マスタの pachimon_id。
  int32 pachimon_id = 2;
}

message GetLoadoutsRequest {
  // プレイヤーの ID(ULID)。
  string player_id = 1;
  // 選出した所持個体の ID(ULID)。この順で返す。
  repeated string player_pachimon_ids = 2;
}

message GetLoadoutsResponse {
  // リクエストの player_pachimon_ids と同じ順。
  repeated Loadout loadouts = 1;
}

// 選出した個体1体の対戦用の所持データ。
message Loadout {
  // 所持個体の ID(ULID)。
  string player_pachimon_id = 1;
  // pachimon マスタの pachimon_id。
  int32 pachimon_id = 2;
  // 能力に割り振ったステータスポイント(名前は努力値のころのまま)。
  EffortValues effort_values = 3;
  // 覚えている技の moves マスタの move_id。技の枠の順。
  repeated int32 move_ids = 4;
}

// 能力ごとのステータスポイント。種族値から計算した能力の値にそのまま足す。
message EffortValues {
  int32 hp = 1;
  int32 atk = 2;
  int32 def = 3;
  int32 spatk = 4;
  int32 spdef = 5;
  int32 speed = 6;
}

message ReportResultRequest {
  // 対戦の ID(ULID)。
  string match_id = 1;
  // 勝者の player_id。空文字なら勝者なし(終了状態を aborted にし、ジェムは付与しない)。
  string winner_id = 2;
  // バトルサーバーに先に参加した側の player_id。マッチ成立時の順と一致するとは限らないので、APIサーバーは ID で突き合わせる。
  // 一度も参加しなかった側は空文字。
  string player1_id = 3;
  // 後から参加した側の player_id。一度も参加しなかった側は空文字。
  string player2_id = 4;
  // player1 が選出した所持個体の ID。選出しなかったら空。
  repeated string player1_selected_pachimon = 5;
  // player2 が選出した所持個体の ID。選出しなかったら空。
  repeated string player2_selected_pachimon = 6;
  // 対戦の記録。行動1つにつき1件。
  repeated BattleTurn turns = 7;
}

// 対戦の記録の1件(battle_turns の1行)。
message BattleTurn {
  // ターンの番号(1〜)。
  int32 turn_number = 1;
  // 行動したプレイヤーの player_id。
  string player_id = 2;
  // 行動の内容(JSON のオブジェクト)。APIサーバーは中身を解釈せずにそのまま保存する。
  string action_data_json = 3;
  // 行動の結果(JSON のオブジェクト。HP の実数などクライアントに送らない値も含む)。中身を解釈せずにそのまま保存する。
  string result_data_json = 4;
}

message ReportResultResponse {}
