# 技グループが含む技の対応表(Shared/docs/design.md の move_group_movesに対応)。
#
# unique_id: このパイプラインは複合PK/複合UNIQUEに対応していないため、
# UNIQUE(group_id, move_id)相当の制約はこの行の代理キー(unique_id)で代替している。
name: move_group_moves
input_csv: move_group_moves_master
fields:
  - name: unique_id
    type: int
    primary_key: true
  - name: group_id
    type: int
  - name: move_id
    type: int
  - name: is_initial
    type: bool
validate:
  unique:
    - unique_id
  check_relation:
    - field: group_id
      table: move_groups
      target_field: move_group_id
    - field: move_id
      table: moves
      target_field: move_id
