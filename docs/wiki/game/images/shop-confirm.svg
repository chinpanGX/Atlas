<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif">
  <defs>
    <g id="gem"><polygon points="0,-8 7,0 0,8 -7,0" fill="#4a90d9"/></g>
    <g id="ticket"><rect x="-10" y="-7" width="20" height="14" rx="2" fill="#f5c542" stroke="#8a6d1a" stroke-width="1"/><line x1="4" y1="-7" x2="4" y2="7" stroke="#8a6d1a" stroke-width="1" stroke-dasharray="2,2"/></g>
    <g id="marker-base"><circle r="12" fill="#e67e22"/></g>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff" stroke="#333" stroke-width="2"/>

  <!-- 背後のショップ画面(簡略) -->
  <rect x="1" y="1" width="958" height="63" fill="#f2f2f2"/>
  <text x="140" y="41" font-size="22" font-weight="bold" fill="#333">ショップ</text>
  <rect x="40" y="136" width="272" height="340" rx="10" fill="#fff" stroke="#333"/>
  <rect x="344" y="136" width="272" height="340" rx="10" fill="#fff" stroke="#333"/>
  <rect x="648" y="136" width="272" height="340" rx="10" fill="#fff" stroke="#333"/>
  <rect x="1" y="1" width="958" height="538" fill="#000" opacity="0.5"/>

  <!-- 確認ダイアログ -->
  <rect x="280" y="100" width="400" height="340" rx="12" fill="#fff" stroke="#333"/>
  <text x="480" y="148" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">購入の確認</text>
  <use xlink:href="#ticket" transform="translate(400,190) scale(1.6)"/>
  <text x="428" y="197" font-size="18" font-weight="bold" fill="#333">育成チケット ×100</text>
  <use xlink:href="#gem" x="436" y="226"/>
  <text x="450" y="232" font-size="15" fill="#555">450ジェムで購入しますか？</text>

  <line x1="312" y1="256" x2="648" y2="256" stroke="#ddd"/>
  <use xlink:href="#gem" x="326" y="282"/>
  <text x="340" y="288" font-size="15" fill="#333">ジェム</text>
  <text x="648" y="288" font-size="16" text-anchor="end" fill="#333">520 → <tspan font-weight="bold" fill="#c0392b">70</tspan></text>
  <line x1="312" y1="304" x2="648" y2="304" stroke="#ddd"/>
  <use xlink:href="#ticket" x="326" y="328"/>
  <text x="342" y="334" font-size="15" fill="#333">育成チケット</text>
  <text x="648" y="334" font-size="16" text-anchor="end" fill="#333">3 → <tspan font-weight="bold" fill="#2e7d32">103</tspan></text>
  <line x1="312" y1="350" x2="648" y2="350" stroke="#ddd"/>

  <rect x="304" y="368" width="168" height="48" rx="8" fill="#fff" stroke="#333"/>
  <text x="388" y="398" font-size="16" text-anchor="middle" fill="#333">やめる</text>
  <rect x="488" y="368" width="168" height="48" rx="8" fill="#333"/>
  <text x="572" y="398" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">購入する</text>

  <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
    <use xlink:href="#marker-base" x="300" y="256"/><text x="300" y="261">1</text>
    <use xlink:href="#marker-base" x="488" y="368"/><text x="488" y="373">2</text>
  </g>

  <text x="20" y="528" font-size="11" fill="#ddd">ワイヤー(案) 購入の確認 / 100枚の商品を選んだとき</text>
</svg>
