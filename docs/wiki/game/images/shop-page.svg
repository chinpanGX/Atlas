<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif">
  <defs>
    <g id="gem"><polygon points="0,-8 7,0 0,8 -7,0" fill="#4a90d9"/></g>
    <g id="ticket"><rect x="-10" y="-7" width="20" height="14" rx="2" fill="#f5c542" stroke="#8a6d1a" stroke-width="1"/><line x1="4" y1="-7" x2="4" y2="7" stroke="#8a6d1a" stroke-width="1" stroke-dasharray="2,2"/></g>
    <g id="plus"><circle r="11" fill="#ccc"/><path d="M-5,0 H5 M0,-5 V5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g>
    <g id="home"><path d="M-9,-1 L0,-9 L9,-1 M-6,-3 V8 H6 V-3" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round"/></g>
    <g id="marker-base"><circle r="12" fill="#e67e22"/></g>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff" stroke="#333" stroke-width="2"/>

  <!-- ヘッダー -->
  <rect x="1" y="1" width="958" height="63" fill="#f2f2f2"/>
  <line x1="0" y1="64" x2="960" y2="64" stroke="#ccc"/>
  <rect x="20" y="14" width="96" height="36" rx="6" fill="#fff" stroke="#333"/>
  <text x="68" y="38" font-size="15" text-anchor="middle" fill="#333">← 戻る</text>
  <text x="140" y="41" font-size="22" font-weight="bold" fill="#333">ショップ</text>

  <rect x="468" y="14" width="190" height="36" rx="18" fill="#fff" stroke="#333"/>
  <use xlink:href="#gem" x="490" y="32"/>
  <text x="506" y="38" font-size="15" fill="#333">ジェム</text>
  <text x="618" y="38" font-size="15" font-weight="bold" text-anchor="end" fill="#333">520</text>
  <use xlink:href="#plus" x="640" y="32"/>

  <rect x="670" y="14" width="210" height="36" rx="18" fill="#fff" stroke="#333"/>
  <use xlink:href="#ticket" x="694" y="32"/>
  <text x="712" y="38" font-size="15" fill="#333">育成チケット</text>
  <text x="840" y="38" font-size="15" font-weight="bold" text-anchor="end" fill="#333">3</text>
  <use xlink:href="#plus" x="862" y="32"/>

  <rect x="892" y="14" width="48" height="36" rx="6" fill="#fff" stroke="#333"/>
  <use xlink:href="#home" x="916" y="32"/>

  <!-- 区分 -->
  <text x="40" y="100" font-size="16" font-weight="bold" fill="#555">育成チケット</text>
  <text x="40" y="120" font-size="13" fill="#888">技の付け替え(5枚)・ステータスポイントの割り振り(1ポイントにつき1枚)に使う</text>

  <!-- 商品1: 10枚 -->
  <rect x="40" y="136" width="272" height="340" rx="10" fill="#fff" stroke="#333"/>
  <use xlink:href="#ticket" transform="translate(176,196) scale(3)"/>
  <text x="176" y="264" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">育成チケット ×10</text>
  <text x="176" y="290" font-size="14" text-anchor="middle" fill="#777">1枚あたり 5ジェム</text>
  <rect x="64" y="400" width="224" height="56" rx="8" fill="#333"/>
  <use xlink:href="#gem" x="128" y="428"/>
  <text x="142" y="434" font-size="18" font-weight="bold" fill="#fff">50</text>
  <text x="250" y="434" font-size="16" text-anchor="end" fill="#fff">購入</text>

  <!-- 商品2: 100枚 -->
  <rect x="344" y="136" width="272" height="340" rx="10" fill="#fff" stroke="#333"/>
  <use xlink:href="#ticket" transform="translate(480,196) scale(3)"/>
  <text x="480" y="264" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">育成チケット ×100</text>
  <text x="480" y="290" font-size="14" text-anchor="middle" fill="#777">1枚あたり 4.5ジェム</text>
  <rect x="425" y="304" width="110" height="26" rx="13" fill="#d9534f"/>
  <text x="480" y="322" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">10%おトク</text>
  <rect x="368" y="400" width="224" height="56" rx="8" fill="#333"/>
  <use xlink:href="#gem" x="424" y="428"/>
  <text x="438" y="434" font-size="18" font-weight="bold" fill="#fff">450</text>
  <text x="554" y="434" font-size="16" text-anchor="end" fill="#fff">購入</text>

  <!-- 商品3: 200枚(ジェム不足) -->
  <rect x="648" y="136" width="272" height="340" rx="10" fill="#fff" stroke="#333"/>
  <use xlink:href="#ticket" transform="translate(784,196) scale(3)"/>
  <text x="784" y="264" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">育成チケット ×200</text>
  <text x="784" y="290" font-size="14" text-anchor="middle" fill="#777">1枚あたり 4ジェム</text>
  <rect x="729" y="304" width="110" height="26" rx="13" fill="#d9534f"/>
  <text x="784" y="322" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">20%おトク</text>
  <text x="784" y="388" font-size="14" text-anchor="middle" fill="#c0392b">あと 280ジェム</text>
  <rect x="672" y="400" width="224" height="56" rx="8" fill="#ddd"/>
  <use xlink:href="#gem" x="728" y="428" opacity="0.4"/>
  <text x="742" y="434" font-size="18" font-weight="bold" fill="#999">800</text>
  <text x="858" y="434" font-size="16" text-anchor="end" fill="#999">購入</text>

  <!-- 注記の番号 -->
  <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
    <use xlink:href="#marker-base" x="460" y="14"/><text x="460" y="19">1</text>
    <use xlink:href="#marker-base" x="548" y="304"/><text x="548" y="309">2</text>
    <use xlink:href="#marker-base" x="368" y="400"/><text x="368" y="405">3</text>
    <use xlink:href="#marker-base" x="672" y="384"/><text x="672" y="389">4</text>
  </g>

  <text x="20" y="528" font-size="11" fill="#aaa">ワイヤー(案) ショップ画面 / ジェム520・チケット3枚のとき</text>
</svg>
