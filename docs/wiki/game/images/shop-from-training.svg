<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif">
  <defs>
    <g id="ticket"><rect x="-10" y="-7" width="20" height="14" rx="2" fill="#f5c542" stroke="#8a6d1a" stroke-width="1"/><line x1="4" y1="-7" x2="4" y2="7" stroke="#8a6d1a" stroke-width="1" stroke-dasharray="2,2"/></g>
    <g id="marker-base"><circle r="12" fill="#e67e22"/></g>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff" stroke="#333" stroke-width="2"/>

  <!-- 背後の育成画面(中身は未定のため枠だけ) -->
  <rect x="1" y="1" width="958" height="63" fill="#f2f2f2"/>
  <text x="140" y="41" font-size="22" font-weight="bold" fill="#333">育成</text>
  <rect x="40" y="96" width="880" height="400" rx="10" fill="#fafafa" stroke="#999" stroke-dasharray="6,4"/>
  <text x="480" y="460" font-size="16" text-anchor="middle" fill="#999">育成画面(技の付け替え・ステータスポイントの割り振り)</text>
  <rect x="1" y="1" width="958" height="538" fill="#000" opacity="0.5"/>

  <!-- チケット不足のダイアログ -->
  <rect x="280" y="130" width="400" height="280" rx="12" fill="#fff" stroke="#333"/>
  <text x="480" y="178" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">育成チケットが足りません</text>
  <text x="480" y="218" font-size="15" text-anchor="middle" fill="#555">技の付け替えには5枚必要です</text>
  <line x1="312" y1="244" x2="648" y2="244" stroke="#ddd"/>
  <use xlink:href="#ticket" x="326" y="268"/>
  <text x="342" y="274" font-size="15" fill="#333">育成チケット</text>
  <text x="648" y="274" font-size="16" text-anchor="end" fill="#333">所持 <tspan font-weight="bold" fill="#c0392b">3</tspan> / 必要 5</text>
  <line x1="312" y1="290" x2="648" y2="290" stroke="#ddd"/>

  <rect x="304" y="332" width="168" height="48" rx="8" fill="#fff" stroke="#333"/>
  <text x="388" y="362" font-size="16" text-anchor="middle" fill="#333">やめる</text>
  <rect x="488" y="332" width="168" height="48" rx="8" fill="#333"/>
  <text x="572" y="362" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">ショップへ</text>

  <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
    <use xlink:href="#marker-base" x="488" y="332"/><text x="488" y="337">1</text>
  </g>

  <text x="20" y="528" font-size="11" fill="#ddd">ワイヤー(案) 育成画面からショップへ / チケット3枚で技を付け替えようとしたとき</text>
</svg>
