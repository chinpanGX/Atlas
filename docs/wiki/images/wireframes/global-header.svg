<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 540" width="960" height="540" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif">
  <defs>
    <g id="gem"><polygon points="0,-8 7,0 0,8 -7,0" fill="#4a90d9"/></g>
    <g id="ticket"><rect x="-10" y="-7" width="20" height="14" rx="2" fill="#f5c542" stroke="#8a6d1a" stroke-width="1"/><line x1="4" y1="-7" x2="4" y2="7" stroke="#8a6d1a" stroke-width="1" stroke-dasharray="2,2"/></g>
    <g id="marker-base"><circle r="12" fill="#e67e22"/></g>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff" stroke="#333" stroke-width="2"/>

  <!-- グローバルヘッダー -->
  <rect x="1" y="1" width="958" height="63" fill="#f2f2f2"/>
  <line x1="0" y1="64" x2="960" y2="64" stroke="#ccc"/>
  <rect x="20" y="14" width="96" height="36" rx="6" fill="#fff" stroke="#333"/>
  <text x="68" y="38" font-size="15" text-anchor="middle" fill="#333">← 戻る</text>
  <text x="140" y="41" font-size="22" font-weight="bold" fill="#333">パーティ編成</text>

  <rect x="504" y="14" width="164" height="36" rx="18" fill="#fff" stroke="#333"/>
  <use xlink:href="#gem" x="526" y="32"/>
  <text x="542" y="38" font-size="15" fill="#333">ジェム</text>
  <text x="652" y="38" font-size="15" font-weight="bold" text-anchor="end" fill="#333">520</text>
  <rect x="680" y="14" width="180" height="36" rx="18" fill="#fff" stroke="#333"/>
  <use xlink:href="#ticket" x="704" y="32"/>
  <text x="722" y="38" font-size="15" fill="#333">育成チケット</text>
  <text x="846" y="38" font-size="15" font-weight="bold" text-anchor="end" fill="#333">3</text>
  <rect x="872" y="14" width="72" height="36" rx="6" fill="#fff" stroke="#333"/>
  <text x="908" y="37" font-size="14" text-anchor="middle" fill="#333">ショップ</text>

  <!-- 画面の中身 -->
  <rect x="40" y="96" width="880" height="400" rx="10" fill="#fafafa" stroke="#999" stroke-dasharray="6,4"/>
  <text x="480" y="290" font-size="16" text-anchor="middle" fill="#999">画面の中身(パーティ編成・スカウト・育成など)</text>
  <text x="480" y="316" font-size="13" text-anchor="middle" fill="#aaa">ヘッダーはアウトゲームの画面で共通</text>

  <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
    <use xlink:href="#marker-base" x="496" y="14"/><text x="496" y="19">1</text>
    <use xlink:href="#marker-base" x="908" y="62"/><text x="908" y="67">2</text>
    <use xlink:href="#marker-base" x="20" y="62"/><text x="20" y="67">3</text>
  </g>

  <text x="20" y="528" font-size="11" fill="#aaa">ワイヤー(案) グローバルヘッダー / パーティ編成画面に出したとき</text>
</svg>
