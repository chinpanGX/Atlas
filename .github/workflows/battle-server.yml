name: BattleServer

on:
  push:
    branches: [develop]
    paths: &paths
      - BattleServer/**
      - Shared/BattleCore/**
      - Shared/BattleContracts/**
      - Shared/proto/**
      - .editorconfig
      - .github/workflows/battle-server.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BattleServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # サーバーをプロセス内で起動するので、MySQL・APIサーバーは要らない
      - name: test
        run: dotnet test BattleServer.slnx
