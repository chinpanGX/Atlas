name: Client Windows Build

# IL2CPP の Windows ビルドは Windows の上でしか作れないので、Windows のランナーで GameCI の Windows 用イメージを使う。
# ビルドに時間がかかるので、手で実行したときと、このワークフロー自体を変えたときだけ動かす。
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/client-windows.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # サブモジュールの URL が SSH なので、CI では鍵の要らない HTTPS で取る(どちらも public)
      - name: submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 UnityScreenNavigator
      - uses: actions/cache@v4
        with:
          path: Client/AtlasUnityProject/Library
          key: Library-Windows-${{ hashFiles('Client/AtlasUnityProject/Packages/packages-lock.json', 'Client/AtlasUnityProject/ProjectSettings/**') }}
          restore-keys: Library-Windows-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Client/AtlasUnityProject
          targetPlatform: StandaloneWindows64
          buildName: Atlas
          # サーバーが見るのはコードの定数のバージョンで、PlayerSettings のバージョンは使わない
          versioning: None
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-Windows
          path: build/StandaloneWindows64
          retention-days: 7
