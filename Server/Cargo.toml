[package]
name = "Server"
version = "0.1.0"
edition = "2024"
# src/bin/配下にも複数binがあるため、`cargo run`単体でAPIサーバー本体を起動できるよう指定
default-run = "Server"

# cargo clippy実行時のみ有効(cargo build/check/testには影響しない)。
# unwrap/expectは起動処理・シードスクリプトでの意図的な使用が多いためwarn止まりとし、
# dbg!/todo!/unimplemented!は現状0件のためdenyにして混入を防ぐ。
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
# 非同期ランタイム。tonic/sqlxの async fn を実行するために必須
tokio = { version = "1", features = ["full"] }

# DBアクセス(MySQL)。マイグレーション管理・コンパイル時クエリチェックも担う。
# jsonフィーチャは、effort_values/candidates等のJSON列をsqlx::types::Json<T>で
# 直接bind/decodeするために使用する
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "mysql-rsa", "migrate", "macros", "chrono", "json"] }

# .envファイルから環境変数(DATABASE_URLなど)を読み込む
dotenvy = "0.15"

# 日時型(created_at, expires_atなど)を扱うために使用。sqlx/serdeと連携
chrono = { version = "0.4", features = ["serde"] }

# リクエスト/レスポンスの構造体をJSONと相互変換するためのシリアライズ/デシリアライズ
serde = { version = "1", features = ["derive"] }

# serdeと組み合わせて実際にJSON文字列⇔Rust構造体の変換処理を行う
serde_json = "1"

# プレイヤー・所持データ・対戦等のIDに使用するID体系(時系列順にソート可能な26文字ID)
ulid = "3"

# スカウトの排出率抽選・ランダム編成に使用
rand = "0.10"

# 構造化ログ。リクエスト/レスポンス・sqlxの実行SQLを同じ出力先(ターミナル)に流す
tracing = "0.1"

# tracingのログをターミナルへ出力する。RUST_LOG(EnvFilter)で出力レベルを切り替える
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TraceLayer: リクエストごとのspan(method/uri)と、ステータス・処理時間のログ出力
tower-http = { version = "0.7", features = ["trace"] }

# マッチ成立時にBattleServerへ渡すbattle_token(短命JWT、HS256)の発行に使用
jsonwebtoken = "9"

# 内部API(BattleInternalService)のサービス間シークレットを定数時間で比較する(タイミング攻撃対策)
subtle = "2"

# gRPCサーバー(クライアント向けのAPIと内部API)。生成コードの実行時のライブラリと、開発時のリフレクション
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-reflection = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
# gRPCのサービスにLayer(認証・日付変更)を付ける
tower = "0.5"

# gRPC基盤(VolTech gRPC)。タグはClient/AtlasUnityProject/Packages/manifest.json・ルートのMakefileと同じにする
voltech-grpc-auth = { git = "https://github.com/chinpanGX/VolTech-gRPC", tag = "v0.1.0" }
voltech-grpc-error = { git = "https://github.com/chinpanGX/VolTech-gRPC", tag = "v0.1.0" }
voltech-grpc-status = { git = "https://github.com/chinpanGX/VolTech-gRPC", tag = "v0.1.0" }
voltech-grpc-transaction = { git = "https://github.com/chinpanGX/VolTech-gRPC", tag = "v0.1.0" }

[build-dependencies]
# Shared/protoの.protoとShared/errors.tomlから、gRPCのサーバーの型とエラーコードの定数を生成する
# (protocを入れなくてもビルドできるように、Rust製のコンパイラprotoxで読み込む)
protox = "0.10"
prost = "0.14"
tonic-prost-build = "0.14"
voltech-grpc-error-build = { git = "https://github.com/chinpanGX/VolTech-gRPC", tag = "v0.1.0" }

[dev-dependencies]
# 結合テストで業務エラーの ErrorInfo を読む
tonic-types = "0.14"
